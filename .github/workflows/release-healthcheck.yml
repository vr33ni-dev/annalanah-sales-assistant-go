name: Release Healthcheck

on:
  schedule:
    - cron: "0 7 * * *" # daily at 07:00 UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check recent commits for missing tags/releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}x
        run: |
          set -euo pipefail

          SINCE=$(date -u -d '24 hours ago' --iso-8601=seconds)
          echo "Checking commits on master since $SINCE"

          commits=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${REPO}/commits?sha=master&since=${SINCE}&per_page=100")

          tags=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${REPO}/tags?per_page=200")

          table=""

          for sha in $(echo "$commits" | jq -r '.[].sha'); do
            tag_match=$(echo "$tags" | jq -r --arg sha "$sha" \
              '.[] | select(.commit.sha == $sha) | .name' | head -n1 || true)

            if [ -z "${tag_match}" ]; then
              short=$(echo "$sha" | cut -c1-7)
              msg=$(echo "$commits" | jq -r --arg sha "$sha" \
                '.[] | select(.sha == $sha) | .commit.message | split("\n")[0]')

              table="${table}| \`${short}\` | ${msg} |\n"
            fi
          done

          if [ -n "$table" ]; then
            echo -e "Found commits merged into master without tags:\n$table"

            title="Release healthcheck: commits on master missing tags"

            body="### 🔍 Release Healthcheck Report

          **Branch:** \`master\`  
          **Time window:** Last 24 hours  

          The following commits were merged into \`master\` but do not have a corresponding tag:

          | SHA | Message |
          |-----|---------|
          ${table}

          ---

          ### 🚀 Next Steps

          If these changes should be released:

          - Create a Git tag
          - Or run the \`rerun-release\` workflow
          "

            # Find existing open issue with same prefix
            existing=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/issues?state=open&per_page=100")

            issue_number=$(echo "$existing" | jq -r \
              --arg prefix "Release healthcheck:" \
              '.[] | select(.title | startswith($prefix)) | .number' \
              | head -n1 || true)

            payload=$(jq -nc --arg t "$title" --arg b "$body" \
              '{title:$t, body:$b}')

            if [ -n "$issue_number" ]; then
              echo "Updating existing issue #$issue_number"
              curl -s -X PATCH \
                -H "Authorization: token ${GITHUB_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${REPO}/issues/$issue_number" \
                -d "$payload" >/dev/null
            else
              echo "Creating new issue"
              curl -s -X POST \
                -H "Authorization: token ${GITHUB_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${REPO}/issues" \
                -d "$payload" >/dev/null
            fi
          else
            echo "No untagged commits found"
          fi
