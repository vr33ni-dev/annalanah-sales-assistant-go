name: Release on master

on:
  push:
    branches:
      - master
    paths-ignore:
      - "VERSION"
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'master') }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"

      - name: Auto bump VERSION (label-driven)
        id: autobump
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels) }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_PUSH_TOKEN: ${{ secrets.REPO_PUSH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Ensure the script is present and executable
          chmod +x .github/scripts/bump-version.sh || true
          # Run the shared bump script to compute and write VERSION
          ./.github/scripts/bump-version.sh VERSION auto

      - name: Commit and push VERSION (if changed)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_PUSH_TOKEN: ${{ secrets.REPO_PUSH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Commit only if there are changes (the bump script writes VERSION)
          if git status --porcelain | grep -q '^'; then
            git add VERSION || true
            git commit -m "chore(release): bump VERSION to $(cat VERSION) [skip ci]" || true
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            # try pushing with GITHUB_TOKEN first, else use REPO_PUSH_TOKEN
            if git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:master; then
              echo "Pushed VERSION with GITHUB_TOKEN"
            else
              echo "Push with GITHUB_TOKEN failed; attempting PAT fallback"
              if [ -n "${REPO_PUSH_TOKEN:-}" ]; then
                git push "https://x-access-token:${REPO_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:master
              else
                echo "No REPO_PUSH_TOKEN configured; continuing (tag push may still include commit)"
              fi
            fi
          else
            echo "No changes to commit"
          fi

      - name: Read VERSION
        id: ver
        run: |
          VERSION=$(cat VERSION)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build binary
        run: |
          mkdir -p dist
          # Build the repository's main package (.) so -o writes a single binary file.
          go build -ldflags "-X github.com/vr33ni-dev/annalanah-sales-assistant-go/pkg/version.Version=${VERSION}" -o dist/app .

      - name: Verify VERSION is a semantic version
        run: |
          VERSION=$(cat VERSION)
          echo "Checking VERSION=$VERSION"
          # Allow vMAJOR.MINOR.PATCH and optional prerelease/build metadata
          if echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?(\+[A-Za-z0-9.-]+)?$'; then
            echo "VERSION looks like semver: $VERSION"
          else
            echo "ERROR: VERSION must be semver (example: v1.2.3). Found: $VERSION"
            exit 1
          fi

      - name: Create git tag (ensure repo has a tag object)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # create and push tag only if it doesn't exist
          if git rev-parse --verify "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "tag ${VERSION} already exists"
          else
            git tag -a "${VERSION}" -m "Release ${VERSION}"
            # Try push tag with GITHUB_TOKEN first, else use REPO_PUSH_TOKEN if available
            if git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" "refs/tags/${VERSION}"; then
              echo "Pushed tag ${VERSION} with GITHUB_TOKEN"
            else
              echo "Push tag with GITHUB_TOKEN failed; attempting REPO_PUSH_TOKEN fallback"
              if [ -n "${{ secrets.REPO_PUSH_TOKEN }}" ]; then
                git push "https://x-access-token:${{ secrets.REPO_PUSH_TOKEN }}@github.com/${{ github.repository }}" "refs/tags/${VERSION}"
              else
                echo "No REPO_PUSH_TOKEN available; tag may need to be pushed manually"
              fi
            fi
          fi

      - name: Create GitHub release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload binary
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/app
          asset_name: app
          asset_content_type: application/octet-stream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
