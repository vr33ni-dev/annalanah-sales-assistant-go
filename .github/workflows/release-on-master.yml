name: Release (auto)

permissions:
  contents: write
  issues: write
  pull-requests: write

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: release-with-auto-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Run tests and build
        run: |
          set -euo pipefail
          go env
          go test ./...
          go build ./...

      - name: Setup Node and install `auto`
        run: |
          set -euo pipefail
          # Avoid npm ci since this is a Go repo without package.json
          node -v || true
          npm --version || true
          npm install --global auto@latest

      - name: Choose token for pushing tags/commits
        id: choose-token
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_PAT:-}" ]; then
            echo "Using RELEASE_PAT for release actions"
            echo "AUTO_TOKEN=${RELEASE_PAT}" >> "$GITHUB_ENV"
          else
            echo "No RELEASE_PAT configured; falling back to GH_TOKEN"
            echo "AUTO_TOKEN=${GH_TOKEN:-}" >> "$GITHUB_ENV"
          fi

      - name: Create release (compute version + changelog, call GitHub API)
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_SHA: ${{ github.sha }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail

          # Prevent recursive runs triggered by the bot
          if [ "${GITHUB_EVENT_NAME:-}" = "push" ] && [ "${GITHUB_ACTOR:-}" = "github-actions[bot]" ]; then
            echo "Run triggered by github-actions[bot]; exiting to avoid recursive release runs."
            exit 0
          fi

          # Compute candidate via auto (dry-run)
          export GH_TOKEN="${AUTO_TOKEN:-${GH_TOKEN:-}}"
          git config user.name "github-actions[bot]" || true
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com" || true

          AUTO_SHIPIT_OUTPUT=$(auto shipit --dry-run 2>&1 || true)
          printf '%s\n' "$AUTO_SHIPIT_OUTPUT" > "$GITHUB_WORKSPACE/auto-shipit-dry-run.log" || true

          CANDIDATE=$(printf '%s' "$AUTO_SHIPIT_OUTPUT" | grep -E -o 'v?[0-9]+\.[0-9]+\.[0-9]+' | head -n1 || true)

          git fetch --tags origin master || true
          LATEST_TAG=$(git describe --tags --abbrev=0 origin/master 2>/dev/null || true)
          if [ -n "${LATEST_TAG:-}" ]; then
            RANGE="${LATEST_TAG}..origin/master"
          else
            RANGE="origin/master"
          fi

          if [ -n "$CANDIDATE" ]; then
            case "$CANDIDATE" in
              v*) TAG_NAME="$CANDIDATE" ;;
              *) TAG_NAME="v$CANDIDATE" ;;
            esac
            echo "Computed candidate tag from auto: $TAG_NAME"
          else
            echo "Warning: 'auto shipit --dry-run' did not return a semver; falling back to git-based bump" >&2
            if [ -n "${LATEST_TAG:-}" ]; then
              BASE=${LATEST_TAG#v}
              IFS='.' read -r MAJOR MINOR PATCH <<< "${BASE}"
              MAJOR=${MAJOR:-0}
              MINOR=${MINOR:-0}
              PATCH=${PATCH:-0}
              PATCH=$((PATCH+1))
              TAG_NAME="v${MAJOR}.${MINOR}.${PATCH}"
            else
              TAG_NAME="v0.1.0"
            fi
            echo "Fallback candidate tag: $TAG_NAME"
          fi

          echo "Computed candidate tag: $TAG_NAME"

          echo "Building changelog for range: $RANGE"
          CHANGELOG=$(git --no-pager log "$RANGE" --pretty=format:"- %s (%an, %h)%n%n%b%n")
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="No changelog entries generated by git log for range $RANGE"
          fi

          echo "Running 'auto shipit' to publish the release for ${TAG_NAME}"
          export GH_TOKEN="${AUTO_TOKEN:-${GH_TOKEN:-}}"
          auto shipit || {
            echo "auto shipit failed; aborting release step" >&2
            exit 1
          }

      - name: Upload auto shipit dry-run output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: auto-shipit-dry-run
          path: auto-shipit-dry-run.log
