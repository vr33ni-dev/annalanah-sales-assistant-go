name: Release (auto)

permissions:
  contents: write
  issues: write
  pull-requests: write

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: release-with-auto-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.24"

      - name: Run tests and build
        run: |
          set -euo pipefail
          go env
          go test ./...
          go build ./...

      - name: Choose token for pushing tags/commits
        id: choose-token
        env:
          GORELEASER_TOKEN: ${{ secrets.GORELEASER_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${GORELEASER_TOKEN:-}" ]; then
            echo "Using repo secret GORELEASER_TOKEN for release actions"
            echo "GITHUB_TOKEN=${GORELEASER_TOKEN}" >> "$GITHUB_ENV"
          elif [ -n "${GH_TOKEN:-}" ]; then
            echo "Using repo secret GH_TOKEN as fallback for release actions"
            echo "GITHUB_TOKEN=${GH_TOKEN}" >> "$GITHUB_ENV"
          else
            echo "::error::No release token found. Set repository secret GORELEASER_TOKEN or GH_TOKEN to allow releases." >&2
            exit 1
          fi

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v3
        with:
          version: latest
          args: release --rm-dist
        env:
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
