name: Check VERSION on pull request

on:
  pull_request:
    types: [opened, edited, labeled, unlabeled, synchronize, reopened]

jobs:
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: |
          git fetch --tags origin

      - name: Compute candidate version (compute-only)
        id: compute
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels) }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/bump-version.sh || true
          # compute-only: do not apply changes
          ./.github/scripts/bump-version.sh VERSION auto --dry-run || true

      - name: Prepare PR comment body
        id: comment
        run: |
          set -euo pipefail
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          NEW_VERSION="${{ steps.compute.outputs.NEW_VERSION }}"
          LABELS_LOWER=$(jq -r '.pull_request.labels[]?.name' "$GITHUB_EVENT_PATH" 2>/dev/null | tr '[:upper:]' '[:lower:]' || true)
          printf '%s\n\n%s\n' \
            "Computed release version if merged to $BASE_REF: **${NEW_VERSION:-<unknown>}**" \
            "Labels considered: ${LABELS_LOWER:-none}" > /tmp/pr_version_comment.md

      - name: Post PR comment with computed version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          COMMENT_BODY=$(cat /tmp/pr_version_comment.md)
          API_URL="https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments"
          echo "Posting comment to $API_URL"
          curl -s -H "Authorization: token $GITHUB_TOKEN" -H "Content-Type: application/json" \
            -d "$(jq -nc --arg body "$COMMENT_BODY" '{body:$body}')" "$API_URL" >/dev/null

      - name: Auto-apply bump to PR branch (same-repo PRs)
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "PR is from same repo; attempting to apply bump to PR branch"
          chmod +x .github/scripts/bump-version.sh || true

          # fetch the PR branch and checkout
          PR_REF=${{ github.event.pull_request.head.ref }}
          git fetch --no-tags origin +refs/heads/${PR_REF}:refs/remotes/origin/${PR_REF} || true
          git checkout -B "${PR_REF}" "origin/${PR_REF}"

          # get live labels for the PR (so re-runs pick up label changes)
          PR_NUM=$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH" 2>/dev/null || true)
          if [ -n "$PR_NUM" ] && [ -n "${GITHUB_TOKEN:-}" ]; then
            PR_LABELS_JSON=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUM}" | jq -c '.labels // []' 2>/dev/null || echo '[]')
          else
            PR_LABELS_JSON=$(jq -c '.pull_request.labels // []' "$GITHUB_EVENT_PATH" 2>/dev/null || echo '[]')
          fi
          export PR_LABELS="$PR_LABELS_JSON"

          # run bump in apply mode (will edit VERSION)
          ./.github/scripts/bump-version.sh VERSION auto --apply

          # commit & push if there are changes
          if git status --porcelain | grep -q '^'; then
            git add VERSION || true
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(release): bump VERSION to $(cat VERSION) [skip ci]" || true

            # attempt to sync with remote first (handle fast-forward conflicts)
            git fetch origin
            REMOTE_REF="origin/${PR_REF}"
            if git rev-parse --verify "$REMOTE_REF" >/dev/null 2>&1; then
              if ! git merge-base --is-ancestor "$REMOTE_REF" HEAD >/dev/null 2>&1; then
                echo "Remote branch has commits not in local; attempting rebase onto $REMOTE_REF"
                if git pull --rebase origin "${PR_REF}"; then
                  echo "Rebase successful"
                else
                  echo "Rebase failed; aborting rebase and creating a fallback branch"
                  git rebase --abort || true
                  SAFE_BRANCH="bump/${PR_REF}-bump-$(date +%s)"
                  git checkout -b "$SAFE_BRANCH"
                  if git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:"$SAFE_BRANCH"; then
                    echo "Pushed fallback branch $SAFE_BRANCH"
                    MSG="Could not push bump to PR branch due to remote divergence; created fallback branch ${SAFE_BRANCH}. Please open a PR to merge it into ${PR_REF}."
                    curl -s -X POST -H "Authorization: token ${GITHUB_TOKEN}" -H "Content-Type: application/json" -d "$(jq -nc --arg body "$MSG" '{body:$body}')" "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR_NUM}/comments" >/dev/null || true
                    exit 1
                  else
                    echo "Failed to push fallback branch $SAFE_BRANCH" >&2
                    exit 1
                  fi
                fi
              else
                echo "Local HEAD already contains remote commits; continuing to push"
              fi
            fi

            if git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:${PR_REF}; then
              echo "Pushed bump to PR branch"
              BODY="Applied automatic version bump to this PR: **$(cat VERSION)**"
              curl -s -X POST -H "Authorization: token ${GITHUB_TOKEN}" -H "Content-Type: application/json" -d "$(jq -nc --arg body "$BODY" '{body:$body}')" "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR_NUM}/comments" >/dev/null || true
            else
              echo "Failed to push bump to PR branch after sync attempts; this may be a protected branch or disallowed by policy" >&2
              exit 1
            fi
          else
            echo "No changes to commit (PR already contains the bump)"
          fi
