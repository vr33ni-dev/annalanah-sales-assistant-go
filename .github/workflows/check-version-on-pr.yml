name: Check release version on pull request

on:
  pull_request:
    types: [opened, edited, labeled, unlabeled, synchronize, reopened]

jobs:
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: |
          git fetch --tags origin

      # Compute candidate version (no file edits)
      - name: Compute candidate version (compute-only)
        id: compute
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels) }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/bump-version.sh || true
          # compute-only: do not apply changes (script emits outputs)
          ./.github/scripts/bump-version.sh VERSION auto --dry-run || true

      - name: Prepare PR comment body
        id: comment
        run: |
          set -euo pipefail
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          NEW_VERSION="${{ steps.compute.outputs.NEW_VERSION }}"
          LABELS_LOWER=$(jq -r '.pull_request.labels[]?.name' "$GITHUB_EVENT_PATH" 2>/dev/null | tr '[:upper:]' '[:lower:]' || true)
          printf '%s\n\n%s\n' \
            "Computed release version if merged to $BASE_REF: **${NEW_VERSION:-<unknown>}**" \
            "Labels considered: ${LABELS_LOWER:-none}" > /tmp/pr_version_comment.md

      - name: Create or update PR comment with computed version
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue_number = context.payload.pull_request.number;
            const marker = '<!-- release-version-check -->';
            const baseRef = context.payload.pull_request.base.ref;
            const newBody = `${marker}\nComputed release version if merged to ${baseRef}: **${process.env.NEW_VERSION || '<unknown>'}**\n\nLabels considered: ${process.env.PR_LABELS || '[]'}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
            });

            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: newBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body: newBody,
              });
            }
        env:
          NEW_VERSION: ${{ steps.compute.outputs.NEW_VERSION }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels) }}
